apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8up
  namespace: k8up
spec:
  interval: 10m

  chart:
    spec:
      chart: k8up
      version: "4.9.0"
      sourceRef:
        kind: HelmRepository
        name: k8up
        namespace: flux-system

  values:
    k8up:
      skipWithoutAnnotation: true