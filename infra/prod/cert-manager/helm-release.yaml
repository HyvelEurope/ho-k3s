apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m

  chart:
    spec:
      chart: cert-manager
      version: "1.20.2"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system

  values:
    crds:
      enabled: true

    webhook:
      podDisruptionBudget:
        enabled: true

    cainjector:
      podDisruptionBudget:
        enabled: true

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-porkbun-webhook
  namespace: cert-manager
spec:
  interval: 10m

  chart:
    spec:
      chart: porkbun-webhook
      version: "0.1.5"
      sourceRef:
        kind: HelmRepository
        name: cert-manager-porkbun-webhook
        namespace: flux-system
