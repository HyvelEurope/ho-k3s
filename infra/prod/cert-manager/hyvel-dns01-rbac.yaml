---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hyvel-dns01-token-reader
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["hyvel-dns01-token"]
    verbs: ["get"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-porkbun-webhook-secret-reader
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hyvel-dns01-token-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: cert-manager-porkbun-webhook
    namespace: cert-manager