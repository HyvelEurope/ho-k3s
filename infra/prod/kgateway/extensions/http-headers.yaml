apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: http-headers
  namespace: kgateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: http

  transformation:
    request:
      set:
        - name: X-Real-IP
          value: '{{ request_header("x-forwarded-for") }}'
