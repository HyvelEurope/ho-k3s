kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: main
  namespace: istio
spec:
  gatewayClassName: istio
  addresses:
    - type: IPAddress
      value: 192.168.200.20
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    - name: https-hyvel
      protocol: HTTPS
      port: 443
      hostname: "*.hyvel.eu"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-hyvel-certificate-secret