kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: main-gw
  namespace: istio
spec:
  gatewayClassName: istio
  addresses:
    - type: IPAddress
      value: 192.168.200.20
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
