apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio
spec:
  interval: 10m
  chart:
    spec:
      chart: base
      version: 1.31.2
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  values:
    global:
      istioNamespace: istio

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio
spec:
  interval: 10m
  dependsOn:
    - name: istio-base
  chart:
    spec:
      chart: istiod
      version: 1.31.2
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  values:
    global:
      istioNamespace: istio
    meshConfig:
      extensionProviders:
        - name: anubis
          envoyExtAuthzHttp:
            service: app.anubis.svc.cluster.local
            port: 80
            includeRequestHeadersInCheck:
              - authorization
              - cookie
            headersToUpstreamOnAllow:
              - authorization
              - path
            headersToDownstreamOnAllow:
              - set-cookie
            headersToDownstreamOnDeny:
              - content-type
              - set-cookie
