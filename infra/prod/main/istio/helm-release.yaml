apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio
spec:
  interval: 10m
  chart:
    spec:
      chart: base
      version: 1.31.2
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  values:
    global:
      istioNamespace: istio

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio
spec:
  interval: 10m
  dependsOn:
    - name: istio-base
  chart:
    spec:
      chart: istiod
      version: 1.31.2
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  values:
    global:
      istioNamespace: istio
    meshConfig:
      extensionProviders:
        - name: anubis
          envoyExtAuthzHttp:
            service: app.anubis.svc.cluster.local
            port: 80
            includeAdditionalHeadersInCheck:
              X-Forwarded-Proto: '%REQ(:SCHEME)%'
              X-Forwarded-Host: '%REQ(:AUTHORITY)%'
              X-Original-Uri: '%REQ(:PATH)%'
              X-Real-IP: '%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%'
            includeRequestHeadersInCheck:
              - cookie
              - user-agent
              - accept 
              - accept-language
              - accept-encoding
              - upgrade-insecure-requests
              - sec-fetch-dest
              - sec-fetch-mode
              - sec-fetch-site
              - sec-fetch-user
              - sec-ch-ua
              - sec-ch-ua-mobile
              - sec-ch-ua-platform
              - sec-ch-ua-arch
              - sec-ch-ua-bitness
              - sec-ch-ua-full-version
              - sec-ch-ua-full-version-list
              - sec-ch-ua-model
              - sec-ch-ua-platform-version
              - sec-ch-ua-wow64
              - cache-control
              - pragma
              - hx-request
              - x-http-version
              - baggage
              - git-protocol
              - cf-worker 
            headersToDownstreamOnAllow:
              - set-cookie
            headersToDownstreamOnDeny:
              - content-type
              - set-cookie
