apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: istio-base
    namespace: istio
spec:
    interval: 10m
    chart:
        spec:
            chart: base
            version: 1.31.2
            sourceRef:
                kind: HelmRepository
                name: istio
                namespace: flux-system

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: istiod
    namespace: istio
spec:
    interval: 10m
    chart:
        spec:
            chart: istiod
            version: 1.31.2
            sourceRef:
                kind: HelmRepository
                name: istio
                namespace: flux-system
