apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium
spec:
  interval: 10m

  chart:
    spec:
      chart: cilium
      version: "1.19.6"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system

  values:
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList:
          - 10.42.0.0/16
        clusterPoolIPv6PodCIDRList:
          - fdbf:edb4:8af0::/112

    loadBalancer:
      mode: dsr
      acceleration: native

    kubeProxyReplacement: true
    routingMode: native

    bpfClockProbe: true
    bpf:
      masquerade: true
      datapathMode: netkit

    autoDirectNodeRoutes: true

    hubble:
      enabled: false

    ipv4:
      enabled: true

    ipv4NativeRoutingCIDR: 10.42.0.0/16

    ipv6:
      enabled: false

    ipv6NativeRoutingCIDR: fdbf:edb4:8af0::/112

    enableIPv6Masquerade: false
    enableIPv4Masquerade: true

    l2announcements:
      enabled: false

    bgpControlPlane:
      enabled: true

    k8sServiceHost: 127.0.0.1
    k8sServicePort: 6443

    envoy:
      enabled: false

    operator:
      replicas: 1

    k8sClientRateLimit:
      qps: 25
      burst: 50
