apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: vw
  labels:
    app.kubernetes.io/name: vw
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vw
      app.kubernetes.io/component: app
  template:
    metadata:
      name: vw
      labels:
        app.kubernetes.io/name: vw
        app.kubernetes.io/component: app
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-app-pvc
      containers:
        - name: vw
          image: vaultwarden/server:1.36.0-alpine
          envFrom:
            - secretRef:
                name: app
          env:
            - name: DOMAIN
              value: https://vault.hyvel.eu/
            - name: ROCKET_PORT
              value: "7561"
          volumeMounts:
            - name: data
              mountPath: "/data"
          livenessProbe:
            httpGet:
              path: /alive
              port: 7561
              scheme: HTTP
            initialDelaySeconds: 180
            timeoutSeconds: 5
            periodSeconds: 15
            successThreshold: 1
            failureThreshold: 5
