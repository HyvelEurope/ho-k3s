apiVersion: v1
kind: Secret
metadata:
    name: app
    namespace: tproxy
stringData:
    config.toml: |
        [general]
        use_middle_proxy = true

        [upstream]
        type = "direct"

        [server]
        public_ip = "hyvel.eu"
        public_port = 443
        port = 7770
        log_level = "debug"

        [censorship]
        tls_domain = "repository.su"
        mask = true
        drs = true
        fast_mode = true

        [web]
        enabled = true
        domain = "cache.hyvel.eu"
        port = 443
        mode = "behind"
        listen = "0.0.0.0"

        [access.users]
        pank = "71a54e3007891961841072af848061e0"
        tengz = "475e12e77a31e225872c2cc5e37fec72"
