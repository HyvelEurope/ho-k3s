apiVersion: traefik.io/v1alpha1
kind: ServersTransportTCP
metadata:
  name: ingress-pp
  namespace: tproxy
spec:
  proxyProtocol:
    version: 2

---

apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: ingress-proxy
  namespace: tproxy
spec:
  tls:
    passthrough: true
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`mirrors.xtom.ee`)
      services:
        - name: app
          port: 7770
          serversTransport: ingress-pp