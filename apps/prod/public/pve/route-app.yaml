apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-plain
  namespace: pve
spec:
  parentRefs:
    - name: main-gw
      namespace: kgateway
      sectionName: http
  hostnames:
    - "pve.hyvel.eu"
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: pve
spec:
  parentRefs:
    - name: main-gw
      namespace: kgateway
      sectionName: https-hyvel
  hostnames:
    - "pve.hyvel.eu"
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - name: app
          kind: Backend
          group: gateway.kgateway.dev
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains; preload"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), geolocation=()"
            remove: [ "x-powered-by" ]

---

apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: app-tls
  namespace: pve
spec:
  targetRefs:
    - name: app
      kind: Backend
      group: gateway.kgateway.dev
  tls:
    insecureSkipVerify: true