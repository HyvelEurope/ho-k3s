apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-plain
  namespace: pve
spec:
  parentRefs:
    - name: http
      namespace: kgateway
      sectionName: http
  hostnames:
    - "pve.hyvel.eu"
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: pve
spec:
  parentRefs:
    - name: http
      namespace: kgateway
      sectionName: https
  hostnames:
    - "pve.hyvel.eu"
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - name: app
          port: 8006
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains; preload"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), geolocation=()"
            remove: [ "x-powered-by" ]

---

apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: app
  namespace: pve
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: app

  extAuth:
    extensionRef:
      name: anubis
      namespace: kgateway