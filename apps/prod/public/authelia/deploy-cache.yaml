apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: authelia
  labels:
    app.kubernetes.io/name: authelia
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authelia
      app.kubernetes.io/component: cache
  template:
    metadata:
      name: cache
      labels:
        app.kubernetes.io/name: authelia
        app.kubernetes.io/component: cache
    spec:
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: cache
      containers:
        - name: valkey
          image: valkey/valkey:9.1.2-alpine
          volumeMounts:
            - name: cache
              mountPath: "/data"

          startupProbe:
            exec:
              command:
                - valkey-cli
                - ping
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
