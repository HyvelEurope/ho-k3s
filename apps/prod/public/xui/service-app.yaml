apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: xui
  labels:
    app.kubernetes.io/name: xui
    app.kubernetes.io/component: app
spec:
  selector:
    app.kubernetes.io/name: xui
    app.kubernetes.io/component: app
  ports:
    - name: web
      port: 7700
    - name: web-config
      port: 7560
    - name: proxy-1
      port: 7554
    - name: proxy-2
      port: 7555
    - name: proxy-3
      port: 7556
    - name: proxy-4
      port: 7670
  type: ClusterIP

