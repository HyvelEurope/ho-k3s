apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-plain
  namespace: xui
spec:
  parentRefs:
    - name: main-gw
      namespace: kgateway
      sectionName: http
  hostnames:
    - "xui.hyvel.eu"
    - "xr.hyvel.eu"
    - "xsu.hyvel.eu"
    - "xp.hyvel.eu"
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: xui
spec:
  parentRefs:
    - name: main-gw
      namespace: kgateway
      sectionName: https
  hostnames:
    - "xui.hyvel.eu"
    - "xr.hyvel.eu"
    - "xsu.hyvel.eu"
    - "xp.hyvel.eu"
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /admin
      backendRefs:
        - name: app
          port: 7581
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains; preload"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), geolocation=()"
            remove: [ "Server" ]


---

apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: app
  namespace: xui
spec:
  parentRefs:
    - name: main-gw
      namespace: kgateway
      sectionName: tls
  hostnames:
    - "www.klick.ee"
  rules:
    - backendRefs:
      - name: app
        port: 7770

---

apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: app-pp
  namespace: xui
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: app
  upstreamProxyProtocol:
    version: V2