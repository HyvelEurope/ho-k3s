apiVersion: v1
kind: Service
metadata:
  name: xui
  namespace: xui
  labels:
    app.kubernetes.io/name: xui
    app.kubernetes.io/component: app
spec:
  selector:
    app.kubernetes.io/name: xui
    app.kubernetes.io/component: app
  ports:
    - name: web
      protocol: TCP
      port: 7700
    - name: web-sub
      protocol: TCP
      port: 7560
    - name: vless-xhttp-tls
      protocol: TCP
      port: 7552
    - name: vless-raw-reality
      protocol: TCP
      port: 7553
    - name: vless-xhttp-reality
      protocol: TCP
      port: 7554
    - name: trojan-raw-reality
      protocol: TCP
      port: 7555
    - name: trojan-xhttp-reality
      protocol: TCP
      port: 7556
    - name: trojan-xhttp-tls
      protocol: TCP
      port: 7557
  type: ClusterIP
