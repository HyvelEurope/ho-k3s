apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: apps-prod-public
  namespace: flux-system

spec:
  interval: 10m
  path: ./apps/prod/public
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-prod
      namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: apps-prod-private
  namespace: flux-system

spec:
  interval: 10m
  path: ./apps/prod/private
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-prod
      namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age