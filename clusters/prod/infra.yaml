apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: infra-prod-main
  namespace: flux-system

spec:
  interval: 10m
  path: ./infra/prod/main
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: infra-prod-extras
  namespace: flux-system

spec:
  interval: 10m
  path: ./infra/prod/extras
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: infra-prod-main
      namespace: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age